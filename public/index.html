<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>เข้าร่วมเกม</title><link rel="stylesheet" href="/style.css">
</head><body data-sfx="top">
<div class="wrap fit">
  <div class="top"><img data-logo class="logo" alt="" style="display:none"><h1 data-title></h1></div>
  <div id="main" class="stack grow"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/theme.js"></script>
<script src="/sfx.js"></script>
<script src="/fx.js"></script>
<script src="/ui.js"></script>
<script>
const $ = s => document.querySelector(s), main = $('#main');
const socket = io({ transports: ['websocket', 'polling'], reconnection: true });
let saved = {}; try { saved = JSON.parse(localStorage.getItem('qp') || '{}'); } catch (e) {}
let view = null, myAnswer = null, joined = false;
const qs = new URLSearchParams(location.search);
const urlPin = qs.get('pin') || '', urlDemo = (qs.get('demo') || '').replace(/[^\w-]/g, '');
if (urlDemo) { if (saved.demo !== urlDemo) saved = {}; }
else if (urlPin && urlPin !== saved.pin) saved = {};
const demoUrl = () => location.origin + '/?demo=' + encodeURIComponent((view && view.code) || urlDemo);
applyTheme(null);

function joinScreen(err) {
  main.innerHTML = `<div class="card stack">
    <label>รหัส PIN<input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(urlPin || saved.pin || '')}"></label>
    <label>ชื่อของคุณ<input id="name" maxlength="16" autocomplete="off" value="${esc(saved.name || '')}"></label>
    <button class="btn big" id="go">เข้าร่วม</button>
    <div class="err" id="err" style="color:#c0132f">${esc(err || '')}</div></div>`;
  $('#go').onclick = doJoin;
  $('#name').onkeydown = e => { if (e.key === 'Enter') doJoin(); };
}
function doJoin() {
  const pin = $('#pin').value.trim(), name = $('#name').value.trim();
  socket.emit('player:join', { pin, name, pid: saved.pin === pin ? saved.pid : null }, r => {
    if (!r.ok) { if (saved.pid) saved = {}; return joinScreen(r.error); }
    saved = { pin, pid: r.pid, name }; localStorage.setItem('qp', JSON.stringify(saved)); joined = true; SFX.unlock(); SFX.join();
  });
}
function demoWelcome(err) {
  socket.emit('demo:info', { code: urlDemo }, r => {
    if (!r || !r.ok) { main.innerHTML = `<div class="card demo-card stack"><h2>😢 ลิงก์หมดอายุ</h2><p>${esc((r && r.error) || err || 'เชื่อมต่อไม่สำเร็จ')}</p></div>`; return; }
    applyTheme(r.theme);
    main.innerHTML = `<div class="card demo-card stack">
      <div><span class="demo-badge">🎮 โหมดทดลองเล่น</span></div>
      <h2>ลองเล่นเกมกันก่อน!</h2>
      <p>เล่นคนเดียว ${r.total} ข้อ ไม่ต้องรอผู้จัด</p>
      <p class="muted" style="font-size:.9rem">คะแนนในโหมดนี้ไม่นับรวมกับเกมจริง</p>
      <label style="text-align:left">ชื่อของคุณ (ไม่ใส่ก็ได้)<input id="dname" maxlength="16" autocomplete="off" value="${esc(saved.name || '')}"></label>
      <button class="btn big" id="dgo">▶ เริ่มทดลองเล่น</button>
      <button class="btn ghost" id="dshare">📤 แชร์ให้เพื่อน</button>
      <div class="err" id="derr" style="color:#c0132f">${esc(err || '')}</div></div>`;
    $('#dgo').onclick = startDemo;
    $('#dname').onkeydown = e => { if (e.key === 'Enter') startDemo(); };
    $('#dshare').onclick = shareDemo;
  });
}
function startDemo() {
  const nameEl = $('#dname'), name = nameEl ? nameEl.value.trim() : (saved.name || '');
  socket.emit('demo:start', { code: urlDemo, name }, r => {
    if (!r.ok) return demoWelcome(r.error);
    saved = { pin: r.pin, pid: r.pid, name, demo: urlDemo };
    try { localStorage.setItem('qp', JSON.stringify(saved)); } catch (e) {}
    joined = true; SFX.unlock(); SFX.join();
  });
}
async function shareDemo() {
  const r = await UI.shareLink(demoUrl(), 'ลองเล่นเกมตอบคำถาม', 'มาลองเล่นเกมตอบคำถามกัน (โหมดทดลองเล่น)');
  if (r === 'copied') UI.toast('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย');
  else if (r === 'fail') UI.toast('คัดลอกไม่สำเร็จ: ' + demoUrl(), 6000);
}
socket.on('connect', () => {
  if (urlDemo) {
    if (saved.demo === urlDemo && saved.pid && saved.pin) {
      socket.emit('player:join', { pin: saved.pin, pid: saved.pid }, r => { if (r.ok) joined = true; else { saved = {}; joined = false; demoWelcome(); } });
    } else if (!joined) demoWelcome();
    return;
  }
  if (saved.pid && saved.pin) {
    socket.emit('player:join', { pin: saved.pin, pid: saved.pid }, r => { if (r.ok) joined = true; else { saved = {}; joined = false; joinScreen(); } });
  } else if (!joined) joinScreen();
});

const buzz = x => { try { navigator.vibrate && navigator.vibrate(x); } catch (e) {} };
function playerSound(v) {
  if (v.state === 'intro') SFX.whoosh();
  else if (v.state === 'reveal') {
    if (v.result && v.result.correct) { SFX.correct(); buzz([80, 40, 120]); }
    else { SFX.wrong(); buzz(250); }
  }
}
socket.on('p:view', v => {
  if (v.theme) applyTheme(v.theme);
  const changed = !view || view.q !== v.q || view.state !== v.state;
  if (changed) myAnswer = v.answered;
  view = v; render();
  if (changed) playerSound(v);
});

const ytRe = /^[\w-]{11}$/;
function demoMedia(m) {
  if (!m) return '';
  if (m.type === 'youtube' && ytRe.test(m.id || '')) return `<div class="demo-media"><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.id)}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="video"></iframe></div></div>`;
  if (m.type === 'video') return `<div class="demo-media"><video class="qmedia" src="${esc(m.url)}" autoplay muted loop playsinline controls></video></div>`;
  return m.url ? `<div class="demo-media"><img class="qmedia" src="${esc(m.url)}" alt=""></div>` : '';
}
const tile = (o, img, i) => `<button class="ans ${img ? 'hasimg' : ''}" style="--c:var(--a${i})" data-i="${i}" aria-label="ตัวเลือก ${i + 1}"><span class="sh">${SHAPES[i]}</span>${img ? `<img src="${esc(img)}" alt="">` : ''}${o ? `<span class="t">${esc(o)}</span>` : ''}</button>`;
let finTimer = null, finFx = false;
function render() {
  const v = view; if (!v) return;
  stopCount(); clearTimeout(finTimer);
  if (v.state !== 'final') finFx = false;
  const st = (cls, html) => main.innerHTML = `<div class="status big ${cls}">${html}</div>`;
  if (v.state === 'lobby') {
    st('wait', `<div>คุณเข้าร่วมแล้ว!</div><small>เห็นชื่อ “${esc(v.name)}” บนจอใหญ่ไหม</small>`);
  } else if (v.state === 'count') {
    main.innerHTML = `<div class="status big ${v.count.announce ? 'hot' : 'wait'}"><small>ข้อ ${v.q + 1} / ${v.total}</small>
      ${v.count.announce ? '<div id="pann"><small>⚡ ข้อสุดท้าย ⚡</small><div class="pann-x2">×2</div><div>คะแนนคูณ 2<br>เตรียมตัว!!</div></div>' : ''}
      <div class="pcdn" id="pcdn"></div></div>`;
    runCount(v.count.ms, v.count.announce, n => {
      const el = $('#pcdn'); if (!el) return;
      if (n === 'announce') { SFX.alert(); buzz([120, 60, 120, 60, 240]); return; }
      const pa = $('#pann'); if (pa) pa.style.display = 'none';
      el.innerHTML = '<span>' + n + '</span>'; SFX.beep(); buzz(40);
    });
  } else if (v.state === 'intro') {
    (v.question.optImg || []).forEach(u => { if (u) new Image().src = u; });
    st('wait', `<small>ข้อ ${v.q + 1} / ${v.total}</small><div>เตรียมตัว!</div><div class="spin"></div>`);
  } else if (v.state === 'question') {
    if (myAnswer == null) {
      const qn = v.question;
      main.innerHTML = `<div class="timer"><i id="bar"></i></div>
        <div class="player-question" role="heading" aria-level="2"><span class="player-question-label">ข้อ ${v.q + 1} / ${v.total}</span><div class="player-question-text">${esc(qn.text || '')}</div></div>
        ${v.demo ? demoMedia(qn.media) : ''}
        <div class="answers big">${qn.options.map((o, i) => tile(o, (qn.optImg || [])[i], i)).join('')}</div>`;
      runTimer($('#bar'), null, v.question.ms, v.question.time * 1000);
      main.querySelectorAll('.ans').forEach(b => b.onclick = () => {
        const i = +b.dataset.i; myAnswer = i; SFX.click(); buzz(30); render();
        socket.emit('player:answer', i, () => {});
      });
    } else {
      const mo = (v.question.options || [])[myAnswer] || '';
      st('wait', `<span style="font-size:4.5rem;color:var(--a${myAnswer})">${SHAPES[myAnswer]}</span><div>ส่งคำตอบแล้ว</div>${mo ? `<small>${esc(mo)}</small>` : ''}<small>รอเพื่อน ๆ ตอบ...</small>`);
    }
  } else if (v.demo && (v.state === 'reveal' || v.state === 'board')) {
    const r = v.result || {}, lastQ = v.q + 1 >= v.total;
    main.innerHTML = `<div class="status big ${r.correct ? 'ok' : 'no'}"><small>ข้อ ${v.q + 1} / ${v.total}</small><div>${r.correct ? 'ถูกต้อง ✓' : (r.answered ? 'ยังไม่ถูก ✗' : 'หมดเวลา ✗')}</div>
      ${r.correct ? `<small>+${r.points} คะแนน</small>` : ''}${r.streak > 1 ? `<small>🔥 ถูกติดกัน ${r.streak} ข้อ</small>` : ''}${r.mult > 1 && r.correct ? '<small>⚡ ข้อสุดท้าย คะแนน ×2</small>' : ''}</div>
      <div class="card center"><div class="muted">คะแนนรวม</div><div class="score">${v.score}</div></div>
      <button class="btn big" id="dnext">${lastQ ? 'ดูผลสรุป' : 'ข้อต่อไป ▶'}</button>`;
    $('#dnext').onclick = () => { SFX.click(); socket.emit('demo:next'); };
  } else if (v.state === 'reveal' || v.state === 'board') {
    const r = v.result || {};
    const behind = v.rank === 1 ? 'คุณนำอยู่อันดับ 1!' : (v.behind ? `ตามหลัง ${esc(v.behind.name)} อยู่ ${v.behind.gap} คะแนน` : '');
    main.innerHTML = `<div class="status big ${r.correct ? 'ok' : 'no'}"><div>${r.correct ? 'ถูกต้อง ✓' : (r.answered ? 'ยังไม่ถูก ✗' : 'หมดเวลา ✗')}</div>
      ${r.correct ? `<small>+${r.points} คะแนน</small>` : ''}${r.streak > 1 ? `<small>🔥 ถูกติดกัน ${r.streak} ข้อ</small>` : ''}${r.mult > 1 && r.correct ? '<small>⚡ ข้อสุดท้าย คะแนน ×2</small>' : ''}</div>
      <div class="card center"><div class="muted">คะแนนรวม</div><div class="score">${v.score}</div><div><b>อันดับ ${v.rank}</b> จาก ${v.of}</div>${behind ? `<div class="muted" style="margin-top:6px">${behind}</div>` : ''}</div>`;
  } else if (v.demo && v.state === 'final') {
    const good = v.correctCount * 2 >= v.total;
    main.innerHTML = `<div class="status big ok"><small>จบโหมดทดลองเล่น · ${esc(v.name)}</small><div>${good ? '🎉 เก่งมาก!' : '👏 เล่นจบแล้ว!'}</div><small>ตอบถูก ${v.correctCount} จาก ${v.total} ข้อ</small></div>
      <div class="card center"><div class="muted">คะแนนรวม</div><div class="score">${v.score}</div></div>
      <div class="demo-acts"><button class="btn big" id="dagain">▶ เล่นอีกครั้ง</button><button class="btn ghost" id="dshare2">📤 แชร์ให้เพื่อนลองเล่น</button></div>`;
    $('#dagain').onclick = startDemo;
    $('#dshare2').onclick = shareDemo;
    if (!finFx) { finFx = true; if (good) { SFX.fanfare(); buzz([100, 50, 100, 50, 250]); FX.cannons(60); } else SFX.reveal(); }
  } else if (v.state === 'final') {
    const key = 'qp_fin_' + saved.pin;
    let t0 = +sessionStorage.getItem(key);
    if (!t0) { t0 = Date.now(); sessionStorage.setItem(key, t0); }
    const wait = podiumTimes(Math.min(3, v.of)).last + 900 - (Date.now() - t0);
    if (wait > 0) {
      st('wait', `<div class="drum-emoji">🥁</div><div>กำลังประกาศผล...</div><small>ดูที่จอใหญ่!</small>`);
      finTimer = setTimeout(render, wait);
    } else {
      main.innerHTML = `<div class="status big ok"><small>จบเกม · ${esc(v.name)}</small><div>${v.rank <= 3 ? ['🥇', '🥈', '🥉'][v.rank - 1] + ' ' : ''}อันดับ ${v.rank}</div><small>จาก ${v.of} คน</small></div>
        <div class="card center"><div class="muted">คะแนนรวม</div><div class="score">${v.score}</div><div>ตอบถูก ${v.correctCount} จาก ${v.total} ข้อ</div></div>`;
      if (!finFx) {
        finFx = true;
        if (v.rank <= 3) { SFX.fanfare(); buzz([100, 50, 100, 50, 250]); FX.cannons(80); FX.rain(4500); }
        else SFX.reveal();
      }
    }
  }
}
</script></body></html>
